<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Meter - Hybrid Integration</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-color: #0a0e27;
            --card-bg: rgba(20, 25, 45, 0.95);
            --text-color: #e0e0e0;
            --heading-color: #ecf0f1;
            --subtext-color: #bdc3c7;
            --border-color: #2c3e50;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        .header h1 {
            color: var(--heading-color);
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #00aaff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--subtext-color);
        }

        .digital-meter-container {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        /* Digital Display Styles */
        .digital-display-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .digital-display {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid;
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .digital-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
        }

        .digital-value {
            font-size: 2.5rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px currentColor;
            position: relative;
            z-index: 1;
        }

        .digital-unit {
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 5px currentColor;
            margin-top: 0.25rem;
        }

        .digital-label {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Status Indicators */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .status-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
        }

        .status-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .status-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .led-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
        }

        .led-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }

        .led-text {
            font-size: 0.85rem;
            color: #ccc;
        }

        /* Color Classes */
        .color-voltage { color: #00aaff; border-color: #00aaff; }
        .color-current { color: #ff6600; border-color: #ff6600; }
        .color-power { color: #00ff00; border-color: #00ff00; }
        .color-frequency { color: #ff00ff; border-color: #ff00ff; }
        .color-pf { color: #ffff00; border-color: #ffff00; }
        .color-reactive { color: #ffaa00; border-color: #ffaa00; }
        .color-temp { color: #ff4444; border-color: #ff4444; }
        .color-thd { color: #44aaff; border-color: #44aaff; }

        .status-good { color: #00ff00; }
        .status-warning { color: #ff8800; }
        .status-critical { color: #ff0000; }

        .meter-info {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .meter-chip {
            padding: 0.5rem 1rem;
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid #3498db;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #3498db;
        }

        .meter-chip.active {
            background: rgba(39, 174, 96, 0.2);
            border-color: #27ae60;
            color: #27ae60;
        }

        .timestamp {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            color: #666;
            font-size: 0.85rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--subtext-color);
        }

        .error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        .control-panel {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        .control-group {
            margin-bottom: 1rem;
        }

        .control-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--heading-color);
        }

        .control-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            font-size: 1rem;
        }

        .btn {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-right: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>⚡ Digital Meter Display</h1>
            <p>Real-time Smart Meter Monitoring with Hybrid React Integration</p>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="control-group">
                <label for="meterSelect">Select Smart Meter:</label>
                <select id="meterSelect">
                    <option value="">Loading meters...</option>
                </select>
            </div>
            <button class="btn" id="connectBtn">Connect to Meter</button>
            <button class="btn" id="refreshBtn">🔄 Refresh Data</button>
        </div>

        <!-- Digital Meter Container -->
        <div id="digital-meter-root"></div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Digital Display Component
        const DigitalDisplay = ({ value, unit, label, colorClass }) => (
            <div className={`digital-display ${colorClass}`}>
                <div className="digital-value">
                    {value !== null && value !== undefined ? value : '--'}
                </div>
                <div className="digital-unit">{unit}</div>
                <div className="digital-label">{label}</div>
            </div>
        );

        // LED Indicator Component
        const LEDIndicator = ({ status, label }) => {
            const statusClass = status === 'good' ? 'status-good' : 
                              status === 'warning' ? 'status-warning' : 'status-critical';
            const ledStyle = { backgroundColor: 'currentColor' };
            
            return (
                <div className="led-indicator">
                    <div className={`led-dot ${statusClass}`} style={ledStyle}></div>
                    <span className="led-text">{label}</span>
                </div>
            );
        };

        // Status Card Component
        const StatusCard = ({ icon, title, status, label, color }) => {
            const iconStyle = { color };
            const titleStyle = { color };
            
            return (
                <div className="status-card">
                    <div className="status-icon" style={iconStyle}>{icon}</div>
                    <div className="status-title" style={titleStyle}>{title}</div>
                    <LEDIndicator status={status} label={label} />
                </div>
            );
        };

        // Main Digital Meter Component
        const DigitalMeter = () => {
            const [meterData, setMeterData] = useState(null);
            const [selectedMeter, setSelectedMeter] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [socket, setSocket] = useState(null);

            // Fetch meter data
            const fetchMeterData = useCallback(async (meterId) => {
                if (!meterId) return;
                
                try {
                    setLoading(true);
                    const response = await axios.get(`/api/meters/${meterId}/readings?limit=1`);
                    if (response.data && response.data.length > 0) {
                        setMeterData(response.data[0]);
                    }
                    setError(null);
                } catch (err) {
                    setError('Failed to fetch meter data: ' + err.message);
                } finally {
                    setLoading(false);
                }
            }, []);

            // Initialize WebSocket connection
            useEffect(() => {
                const ws = io('http://localhost:5000', {
                    transports: ['websocket', 'polling']
                });

                ws.on('connect', () => {
                    console.log('WebSocket connected');
                });

                ws.on('meter_reading', (data) => {
                    if (selectedMeter && data.meter_id === selectedMeter.id) {
                        setMeterData(data.reading);
                    }
                });

                ws.on('disconnect', () => {
                    console.log('WebSocket disconnected');
                });

                setSocket(ws);

                return () => {
                    ws.disconnect();
                };
            }, [selectedMeter]);

            // Subscribe to meter updates
            useEffect(() => {
                if (socket && selectedMeter) {
                    socket.emit('subscribe_meter', { meter_id: selectedMeter.id });
                    fetchMeterData(selectedMeter.id);
                }
            }, [socket, selectedMeter, fetchMeterData]);

            // Get health status
            const getHealthStatus = (value, thresholds) => {
                if (value < thresholds.good) return 'good';
                if (value < thresholds.warning) return 'warning';
                return 'critical';
            };

            if (loading && !meterData) {
                return (
                    <div className="digital-meter-container">
                        <div className="loading">
                            <div className="pulse">⚡ Loading meter data...</div>
                        </div>
                    </div>
                );
            }

            if (error) {
                return (
                    <div className="digital-meter-container">
                        <div className="error">{error}</div>
                    </div>
                );
            }

            if (!selectedMeter) {
                return (
                    <div className="digital-meter-container">
                        <div className="loading">Please select a meter from the dropdown above</div>
                    </div>
                );
            }

            const reading = meterData || {};

            return (
                <div className="digital-meter-container">
                    {/* Meter Info */}
                    <div className="meter-info">
                        <div className="meter-chip active">
                            {selectedMeter.name} ({selectedMeter.id})
                        </div>
                        <div className="meter-chip">{selectedMeter.meter_type}</div>
                        <div className="meter-chip">{selectedMeter.location}</div>
                        <div className="meter-chip active">{selectedMeter.status}</div>
                    </div>

                    {/* Primary Measurements */}
                    <div className="digital-display-grid">
                        <DigitalDisplay
                            value={reading.voltage_rms?.toFixed(1)}
                            unit="V"
                            label="Voltage RMS"
                            colorClass="color-voltage"
                        />
                        <DigitalDisplay
                            value={reading.current_rms?.toFixed(2)}
                            unit="A"
                            label="Current RMS"
                            colorClass="color-current"
                        />
                        <DigitalDisplay
                            value={reading.power_active?.toFixed(1)}
                            unit="kW"
                            label="Active Power"
                            colorClass="color-power"
                        />
                        <DigitalDisplay
                            value={reading.frequency?.toFixed(1)}
                            unit="Hz"
                            label="Frequency"
                            colorClass="color-frequency"
                        />
                    </div>

                    {/* Secondary Measurements */}
                    <div className="digital-display-grid">
                        <DigitalDisplay
                            value={reading.power_factor?.toFixed(3)}
                            unit=""
                            label="Power Factor"
                            colorClass="color-pf"
                        />
                        <DigitalDisplay
                            value={reading.power_reactive?.toFixed(1)}
                            unit="kVAR"
                            label="Reactive Power"
                            colorClass="color-reactive"
                        />
                        <DigitalDisplay
                            value={reading.temperature?.toFixed(1)}
                            unit="°C"
                            label="Temperature"
                            colorClass="color-temp"
                        />
                        <DigitalDisplay
                            value={reading.thdv?.toFixed(2)}
                            unit="%"
                            label="THD Voltage"
                            colorClass="color-thd"
                        />
                    </div>

                    {/* Status Indicators */}
                    <div className="status-grid">
                        <StatusCard
                            icon="⚡"
                            title="Power Quality"
                            status={getHealthStatus(reading.thdv || 0, { good: 5, warning: 8 })}
                            label={`THD: ${reading.thdv?.toFixed(2) || '--'}%`}
                            color="#ffff00"
                        />
                        <StatusCard
                            icon="🔌"
                            title="Load Status"
                            status={getHealthStatus(reading.power_active || 0, { good: 50, warning: 80 })}
                            label={`Load: ${((reading.power_active || 0) / 100 * 100).toFixed(0)}%`}
                            color="#00ff00"
                        />
                        <StatusCard
                            icon="🌡️"
                            title="Thermal"
                            status={getHealthStatus(reading.temperature || 0, { good: 40, warning: 60 })}
                            label={`Temp: ${reading.temperature?.toFixed(1) || '--'}°C`}
                            color="#ff4444"
                        />
                        <StatusCard
                            icon="📊"
                            title="Frequency"
                            status={Math.abs((reading.frequency || 50) - 50) < 0.5 ? 'good' : 
                                   Math.abs((reading.frequency || 50) - 50) < 1 ? 'warning' : 'critical'}
                            label={`Freq: ${reading.frequency?.toFixed(1) || '--'} Hz`}
                            color="#ff00ff"
                        />
                    </div>

                    {/* Timestamp */}
                    {reading.timestamp && (
                        <div className="timestamp">
                            Last Updated: {new Date(reading.timestamp).toLocaleString()}
                        </div>
                    )}
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('digital-meter-root'));
        
        // Global state management
        window.DigitalMeterApp = {
            setSelectedMeter: (meter) => {
                window.selectedMeterData = meter;
                root.render(<DigitalMeter />);
            }
        };

        root.render(<DigitalMeter />);
    </script>

    <script>
        // Vanilla JS integration
        let meters = [];
        let selectedMeter = null;

        // Load meters on page load
        async function loadMeters() {
            try {
                const response = await axios.get('/api/meters');
                meters = response.data;
                
                const select = document.getElementById('meterSelect');
                select.innerHTML = '<option value="">Select a meter...</option>';
                
                meters.forEach(meter => {
                    const option = document.createElement('option');
                    option.value = meter.id;
                    option.textContent = `${meter.name} (${meter.id}) - ${meter.location}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Failed to load meters:', error);
                document.getElementById('meterSelect').innerHTML = 
                    '<option value="">Error loading meters</option>';
            }
        }

        // Connect to selected meter
        function connectToMeter() {
            const select = document.getElementById('meterSelect');
            const meterId = select.value;
            
            if (!meterId) {
                alert('Please select a meter first');
                return;
            }
            
            selectedMeter = meters.find(m => m.id === meterId);
            if (selectedMeter && window.DigitalMeterApp) {
                window.DigitalMeterApp.setSelectedMeter(selectedMeter);
            }
        }

        // Event listeners
        document.getElementById('connectBtn').addEventListener('click', connectToMeter);
        document.getElementById('refreshBtn').addEventListener('click', () => {
            if (selectedMeter && window.DigitalMeterApp) {
                window.DigitalMeterApp.setSelectedMeter(selectedMeter);
            }
        });

        document.getElementById('meterSelect').addEventListener('change', (e) => {
            if (e.target.value) {
                connectToMeter();
            }
        });

        // Initialize
        loadMeters();
    </script>
</body>

</html>
